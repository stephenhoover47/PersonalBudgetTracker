name: Household MVP checks
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
concurrency:
  group: household-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: budget
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: budget_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U budget -d budget_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest tests -q
        working-directory: backend
      - run: alembic -c household-alembic.ini upgrade head && alembic -c household-alembic.ini check
        working-directory: backend
        env:
          DATABASE_URL: postgresql://budget:test-only-password@localhost:5432/budget_test
      - run: python -m pytest tests -q
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql://budget:test-only-password@localhost:5432/budget_test
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements-dev.txt
      - run: npm ci && npm test && npm run build && npm audit --audit-level=moderate
        working-directory: frontend
      - run: npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: frontend/test-results

  docker:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: budget
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: hearth_mvp_staging
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U budget -d hearth_mvp_staging"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Build the complete application image
        run: docker build -t hearth-mvp:ci .
      - name: Verify image runs as an unprivileged user
        run: test "$(docker run --rm hearth-mvp:ci id -u)" != "0"
      - name: Apply migrations from the built image
        run: >-
          docker run --rm --network host
          -e DATABASE_URL=postgresql://budget:test-only-password@127.0.0.1:5432/hearth_mvp_staging
          -e APP_TIER=staging -e STAGING_DB_HOST=127.0.0.1
          -e STAGING_STEPHEN_PASSWORD=ci-only-sample-password-one
          -e STAGING_CLAIRE_PASSWORD=ci-only-sample-password-two
          hearth-mvp:ci python -m household.staging_prepare
      - name: Start the built application
        run: >-
          docker run -d --name hearth-ci --network host
          -e DATABASE_URL=postgresql://budget:test-only-password@127.0.0.1:5432/hearth_mvp_staging
          -e APP_ENV=production -e APP_ORIGIN=https://staging.example.test
          hearth-mvp:ci
      - name: Verify health, compiled frontend and authentication boundary
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS http://127.0.0.1:8000/ > /tmp/hearth-index.html
          python -c "from pathlib import Path; s=Path('/tmp/hearth-index.html').read_text(); assert '/assets/' in s and 'Hearth' in s"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/me)" = "401"
      - name: Show container logs and stop it
        if: always()
        run: docker logs hearth-ci || true; docker rm -f hearth-ci || true
