name: Household MVP checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: budget
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: budget_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U budget -d budget_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest tests -q
        working-directory: backend
      - run: alembic -c household-alembic.ini upgrade head && alembic -c household-alembic.ini check
        working-directory: backend
        env:
          DATABASE_URL: postgresql://budget:test-only-password@localhost:5432/budget_test
      - run: python -m pytest tests -q
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql://budget:test-only-password@localhost:5432/budget_test
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements-dev.txt
      - run: npm ci && npm test && npm run build && npm audit --audit-level=moderate
        working-directory: frontend
      - run: npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: frontend/test-results
